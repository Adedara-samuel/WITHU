name: Keep API awake

# Render's free tier spins the API down after 15 minutes with no traffic, which makes
# the next real request (someone sending a chat message) hang for 30-60s while it wakes
# back up. A periodic ping counts as traffic and resets that idle timer, so the API
# stays warm and chat stays fast.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: curl -fsS --max-time 60 https://withu-api.onrender.com/health
